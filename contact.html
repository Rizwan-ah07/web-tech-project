<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frosty Fragrances - Contact Us</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>

  <header>
    <nav>
      <section class="container-nav">
        <a href="index.html" class="logo">
          <img src="assets/images/frost-logo.webp" alt="Frosty Fragrances Logo">
      </a>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>

        <section class="nav-bar"> </section>
      </section>
    </nav>
    <form action="search.html" method="get" class="search-form">
      <input type="text" name="query" placeholder="Search products...">
      <button type="submit">Search</button>
    </form>
    <div class="bookmark-qr">
      <img src="assets/images/QR-Code.png" alt="QR Code" id="qr-code" class="qr-small">
    </div>
</header>
<div id="qr-modal" class="qr-modal">
  <div class="qr-modal-content">
    <span id="qr-close" class="qr-close">&times;</span>
    <img src="assets/images/QR-Code.png" alt="Full QR Code" id="qr-full-image">
  </div>
</div>

  <main>

    <section class="contact-form">
      <h1>Contact Us</h1>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>

  </main>
  <section class="map-section">
    <h2>Our Location</h2>
    <div id="map"></div>
  </section>

  <footer>
    &copy; 2024 Rizwan Hussain
    <div class="social-icons">
      <a id="github" href="https://github.com/Rizwan-ah07" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <i class="fab fa-github fa-2x"></i>
      </a>
  
      <a href="https://www.linkedin.com/in/rizwan-hussain-768973226/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <i class="fab fa-linkedin fa-2x"></i>
      </a>
    </div>
  </footer>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([51.2301671, 4.4161295], 13); 

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var icon = L.icon({
      iconUrl: 'assets/images/frost-logo.webp', 
      iconSize: [50, 50], 
      iconAnchor: [25, 50]
    });

    L.marker([51.2301671, 4.4161295], { icon: icon }).addTo(map)
      .openPopup();
    L.marker([51.2303, 4.4142], { icon: icon }).addTo(map)
      .openPopup();
  </script>
<script src="js/script.js" defer></script>
</body>
</html>
