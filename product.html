<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frosty Fragrances - Product Details</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav>
      <section class="container-nav">
        <a href="index.html" class="logo">
          <img src="assets/images/frost-logo.webp" alt="Frosty Fragrances Logo">
      </a>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>

        <section class="nav-bar"> </section>
      </section>
    </nav>
    <form action="search.html" method="get" class="search-form">
      <input type="text" name="query" placeholder="Search products...">
      <button type="submit">Search</button>
    </form>
    <div class="bookmark-qr">
      <img src="assets/images/QR-Code.png" alt="QR Code" id="qr-code" class="qr-small">
    </div>
</header>
<div id="qr-modal" class="qr-modal">
  <div class="qr-modal-content">
    <span id="qr-close" class="qr-close">&times;</span>
    <img src="assets/images/QR-Code.png" alt="Full QR Code" id="qr-full-image">
  </div>
</div>
  <div id="notification-container"></div>

  <main>
    <aside id="shopping-cart" class="cart-sidebar">
      <h2>Shopping Cart</h2>
      <ul id="cart-items"></ul>
      <p id="total-price">Total: €0.00</p>
      <button id="checkout-button">Checkout</button>
    </aside>
    <article class="product-detail">
      <h1>Product Name</h1>

      <figure>
        <img src="" alt="" height="350px" width="350px">
        <figcaption>Product description goes here...</figcaption>
      </figure>

      <p class="price">Prijs: €<span id="product-price"></span></p>

      <section class="product-features">
        <h3>Features</h3>
        <ul>
        </ul>
      </section>

      <section class="product-buttons">
        <button class="add-to-cart">Add to Cart</button>
        <button class="add-to-wishlist">Add to Wishlist</button>
      </section>

      <section class="review-section">
        <h3>Leave a Review</h3>
        <form>
          <label for="username">Name:</label>
          <input type="text" id="username" name="username" required>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>

          <label for="review">Review:</label>
          <textarea id="review" name="review" required></textarea>

          <button id="review-button" type="submit">Submit Review</button>
        </form>
      </section>
    </article>
  </main>

  <footer>
    &copy; 2024 Rizwan Hussain
    <div class="social-icons">
      <a id="github" href="https://github.com/Rizwan-ah07" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <i class="fab fa-github fa-2x"></i>
      </a>
  
      <a href="https://www.linkedin.com/in/rizwan-hussain-768973226/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <i class="fab fa-linkedin fa-2x"></i>
      </a>
    </div>
  </footer>

  <script src="js/script.js" defer></script>
</body>
</html>
